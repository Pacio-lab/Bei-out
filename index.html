<title>BRIXOUT — Cosa fai stasera a Brescia?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --notte:#061845;      /* fondo: blu notte Brescia */
  --blu:#0B2A8F;        /* superfici */
  --el:#2F6BFF;         /* elettrico: azioni, glow */
  --cielo:#9FC0FF;      /* secondario, testi tenui */
  --bianco:#FFFFFF;
  --ink:#0A1240;
  --dim:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.12);
  --display:'Archivo',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--notte);color:var(--bianco);-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background:radial-gradient(60% 40% at 20% 0%,#1E48D8 0%,transparent 60%),radial-gradient(50% 40% at 100% 90%,#153BB8 0%,transparent 60%)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--el);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 18px}

/* ============ HEADER + TICKER ============ */
header{padding:16px 0 0}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:24px;letter-spacing:-.02em;line-height:1;display:flex;align-items:center;gap:10px}
.logo i{width:10px;height:10px;background:var(--bianco);border-radius:50%;box-shadow:0 0 0 5px rgba(255,255,255,.18),0 0 24px var(--el);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,.08),0 0 30px var(--el)}}
.iconb{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s}
.iconb:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
.iconb svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.ticker{margin:16px -18px 0;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);overflow:hidden;white-space:nowrap;padding:9px 0}
.ticker div{display:inline-block;animation:tk 32s linear infinite;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cielo)}
.ticker span{padding:0 22px}
.ticker span::before{content:"✦";margin-right:22px;color:var(--el)}
@keyframes tk{to{transform:translateX(-50%)}}

.claim{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(34px,10vw,72px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase;margin:28px 0 6px}
.claim em{font-style:normal;color:transparent;-webkit-text-stroke:1.5px var(--cielo)}
.sub{font-size:14px;color:var(--dim);max-width:420px}

/* ============ GIORNI ============ */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:22px 0 0;padding-bottom:4px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;transition:all .2s}
.day[aria-pressed=true]{background:#fff;color:var(--notte);border-color:#fff;box-shadow:0 0 30px rgba(159,192,255,.35)}

/* ============ HERO: evento in evidenza ============ */
.hero{margin-top:22px;border-radius:24px;overflow:hidden;position:relative;aspect-ratio:4/5;background:var(--blu);text-align:left;display:block;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
@media(min-width:700px){.hero{aspect-ratio:16/8}}
.hero .pst{position:absolute;inset:0}
.hero .pst img{width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,24,69,0) 30%,rgba(6,24,69,.92) 100%)}
.hero .tag{position:absolute;top:16px;left:16px;display:flex;gap:8px}
.chip{background:#fff;color:var(--notte);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:7px 11px;border-radius:999px}
.chip.blue{background:var(--el);color:#fff}
.hero .txt{position:absolute;left:18px;right:18px;bottom:18px}
.hero .txt .when{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cielo);margin-bottom:8px}
.hero .txt h2{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(24px,7vw,44px);line-height:.98;letter-spacing:-.02em;text-transform:uppercase}
.hero .txt p{margin-top:10px;font-size:14px;color:var(--dim)}
.hero .txt p b{color:#fff;font-weight:600}
.hero .go{position:absolute;right:16px;bottom:18px;width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .2s}
.hero:hover .go{transform:scale(1.08) rotate(-8deg)}
.hero .go svg{width:22px;height:22px;stroke:var(--notte);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ============ LA MAPPA (firma) ============ */
.mapsec{margin-top:34px}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sech h3{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cielo)}
.sech span{font-size:12px;color:var(--dim);font-weight:600}
.mapbox{border:1.5px solid var(--line);border-radius:24px;padding:10px 6px 4px;background:rgba(11,42,143,.25);backdrop-filter:blur(6px)}
.map{width:100%;height:auto;display:block;overflow:visible}
.map .route{fill:none;stroke:rgba(159,192,255,.25);stroke-width:2;stroke-dasharray:3 5;stroke-linecap:round}
.map .route.on{stroke:var(--el);stroke-dasharray:none;stroke-width:3;filter:drop-shadow(0 0 6px var(--el))}
.map .lake{fill:rgba(47,107,255,.18);stroke:rgba(159,192,255,.45);stroke-width:1.2;transition:fill .25s}
.map .lake.on{fill:rgba(47,107,255,.5)}
.map .node{cursor:pointer}
.map .node circle.c{fill:var(--notte);stroke:var(--cielo);stroke-width:2;transition:all .25s}
.map .node.on circle.c{fill:#fff;stroke:#fff;filter:drop-shadow(0 0 10px var(--el))}
.map .node circle.ring{fill:none;stroke:var(--el);stroke-width:1.5;opacity:0}
.map .node.on circle.ring{opacity:1;animation:ring 1.8s infinite}
@keyframes ring{from{r:9;opacity:.9}to{r:22;opacity:0}}
.map .node text{font-family:var(--body);font-weight:700;font-size:9.5px;fill:#fff;text-anchor:middle;letter-spacing:.02em}
.map .node text.s{font-weight:500;font-size:7.5px;fill:var(--cielo)}
.map .node text.k{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:8px;fill:var(--notte);text-anchor:middle;dominant-baseline:central}
.map .node .badge{fill:var(--el)}
.map .node.dim{opacity:.45}
.map .star{fill:#fff}

/* ============ TIPI ============ */
.tipi{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px 0 6px;padding-bottom:4px}
.tipi::-webkit-scrollbar{display:none}
.tipo{flex:0 0 auto;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center;transition:all .2s;color:var(--dim)}
.tipo[aria-pressed=true]{background:var(--el);border-color:var(--el);color:#fff}
.search{margin:10px 0 0;display:none}
.search.open{display:block}
.search input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:15px}
.search input::placeholder{color:var(--dim)}

/* ============ GRIGLIA LOCANDINE ============ */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}}
.card{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:3/4.3;background:var(--blu);text-align:left;display:block;width:100%;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation:pop .4s both;box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
.card:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 30px 50px -20px rgba(47,107,255,.5)}
.card:nth-child(even):hover{transform:translateY(-6px) rotate(.6deg)}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pst{position:absolute;inset:0;overflow:hidden}
.pst img{width:100%;height:100%;object-fit:cover;display:block}
/* locandine generate: 3 stili */
.pst.gen{display:flex;flex-direction:column;justify-content:flex-start;padding:14px}
.pst.gen .big{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(18px,5.6vw,30px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase;word-break:break-word;position:relative;z-index:1}
.pst.gen.s0{background:radial-gradient(circle at 80% 20%,#3F7BFF 0%,transparent 45%),var(--blu)}
.pst.gen.s0::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.28) 1.2px,transparent 1.3px);background-size:11px 11px;mask:linear-gradient(160deg,#000 20%,transparent 75%)}
.pst.gen.s1{background:#fff;color:var(--notte)}
.pst.gen.s1::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-35deg,var(--el) 0 14px,transparent 14px 28px);opacity:.18;mask:linear-gradient(180deg,transparent 30%,#000 100%)}
.pst.gen.s1 .big{color:var(--blu)}
.pst.gen.s2{background:linear-gradient(160deg,#173FBF,var(--notte))}
.pst.gen.s2 .big{color:transparent;-webkit-text-stroke:1.4px #fff}
.pst.gen.s2::after{content:"";position:absolute;left:-30%;bottom:-40%;width:130%;aspect-ratio:1;border-radius:50%;border:38px solid rgba(47,107,255,.35)}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(6,24,69,.95) 100%)}
.card .top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.card .chip{font-size:10px;padding:5px 9px}
.heart{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.heart svg{width:15px;height:15px;fill:none;stroke:var(--notte);stroke-width:2.2}
.heart.on svg{fill:var(--el);stroke:var(--el)}
.card .txt{position:absolute;left:12px;right:12px;bottom:12px;z-index:2}
.card .when{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cielo)}
.card h4{font-size:15px;font-weight:700;line-height:1.15;margin:5px 0 4px;letter-spacing:-.01em}
.card .where{font-size:12px;color:var(--dim)}
.card .where b{color:#fff;font-weight:600}
.empty{grid-column:1/-1;text-align:center;padding:56px 18px;border:1.5px dashed var(--line);border-radius:20px;color:var(--dim)}
.empty strong{display:block;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:16px;color:#fff;margin-bottom:8px;text-transform:uppercase}

/* ============ LOCALI ============ */
.venues{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.venues::-webkit-scrollbar{display:none}
.venue{flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:16px;padding:8px 14px 8px 8px;font-size:13px;font-weight:600;text-align:left;transition:all .2s;background:rgba(255,255,255,.04)}
.venue:hover{border-color:var(--el);background:rgba(47,107,255,.15)}
.venue .av{width:36px;height:36px;border-radius:11px;background:#fff;color:var(--notte);font-family:var(--display);font-stretch:125%;font-weight:900;font-size:12px;display:grid;place-items:center}
.venue small{display:block;font-weight:500;color:var(--dim);font-size:11px}

/* ============ SHEET ============ */
.overlay{position:fixed;inset:0;background:rgba(3,12,40,.7);backdrop-filter:blur(6px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;color:var(--ink);border-radius:28px 28px 0 0;max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .4s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
@media(min-width:700px){.sheet{max-width:560px;margin:0 auto;border-radius:28px;bottom:24px}}
.grab{width:44px;height:5px;border-radius:5px;background:#DDE4F7;margin:10px auto 0}
.sheet .pst.sp{position:relative;margin:14px 18px 0;border-radius:20px;aspect-ratio:4/3;overflow:hidden}
.sb{padding:16px 18px 22px}
.eyebrow{font-size:11px;font-weight:800;color:var(--el);letter-spacing:.12em;text-transform:uppercase}
.sheet h2{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:24px;letter-spacing:-.02em;line-height:1;text-transform:uppercase;margin:8px 0 12px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.meta div{background:#F1F5FF;border-radius:14px;padding:10px 12px}
.meta small{display:block;font-size:10.5px;color:#6B7394;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.meta b{font-size:15px}
.desc{font-size:14.5px;line-height:1.5;color:#2A2F4D}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{flex:1 1 auto;min-width:120px;padding:15px 16px;border-radius:14px;font-weight:700;font-size:14px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--notte);color:#fff}
.btn.ghost{background:#F1F5FF;color:var(--blu)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{margin-top:14px;font-size:12.5px;color:#6B7394;line-height:1.45}
.sheet .grid{grid-template-columns:1fr 1fr;margin-top:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;font-weight:800;color:#6B7394;text-transform:uppercase;letter-spacing:.08em}
.field input,.field select,.field textarea{font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1.5px solid #DDE4F7;background:#fff;color:var(--ink)}
.field textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:2px dashed #9FC0FF;border-radius:14px;padding:18px;text-align:center;color:#6B7394;font-size:13px;position:relative;background:#F1F5FF}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{max-height:160px;border-radius:10px;margin-top:10px}

/* ============ INSTALLA ============ */
.install{display:none;align-items:center;gap:12px;margin:18px 0 0;padding:12px 14px;border-radius:18px;background:#fff;color:var(--notte)}
.install.show{display:flex}
.install img{width:44px;height:44px;border-radius:12px}
.install b{display:block;font-size:14px}
.install small{font-size:12px;color:#6B7394}
.install .ib{margin-left:auto;background:var(--notte);color:#fff;font-weight:800;font-size:13px;padding:10px 14px;border-radius:999px;white-space:nowrap}
.install .ix{width:28px;height:28px;display:grid;place-items:center;color:#6B7394;font-size:18px}
/* ============ FAB / TOAST / FOOTER ============ */
.fab{position:fixed;right:18px;bottom:22px;z-index:35;background:#fff;color:var(--notte);border-radius:999px;padding:15px 20px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 40px rgba(47,107,255,.45);transition:transform .2s}
.fab:hover{transform:translateY(-2px)}
.fab svg{width:18px;height:18px;stroke:var(--notte);fill:none;stroke-width:2.6;stroke-linecap:round}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#fff;color:var(--notte);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:all .3s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;font-size:12px;color:var(--dim);padding:40px 18px 120px;line-height:1.7;position:relative;z-index:1}
footer .big{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(40px,14vw,120px);line-height:1;color:transparent;-webkit-text-stroke:1px rgba(159,192,255,.35);text-transform:uppercase;letter-spacing:-.03em;margin-bottom:14px}
</style>
</head>

<script>
/* =====================================================================
   DATI — come collegare i locali (es. Coco Beach)
   1) Ogni locale ha ig / maps: i bottoni della scheda rimandano lì.
   2) Ogni evento può avere "poster": URL della locandina del locale.
      Se manca, BRIXOUT genera una locandina biancoblu (3 stili a rotazione).
   3) Metti gli eventi in un events.json (stessa struttura) e indica l'URL
      in FEED_URL: l'app lo scarica all'avvio. Va bene anche un Google
      Sheet pubblicato come JSON.
   Eventi, prezzi e handle Instagram qui sotto sono DEMO da verificare.
   ===================================================================== */
/* ---- BACKEND (Supabase) ------------------------------------------------
   Incolla qui URL e chiave "anon public" del tuo progetto (Settings → API).
   Con i campi compilati l'app legge locali ed eventi dal database e le
   locandine caricate finiscono nello storage: le vedono tutti.
   Con i campi vuoti gira in modalità demo con i dati qui sotto.
   Setup: vedi supabase-setup.sql e GUIDA-BACKEND.md.
   ---------------------------------------------------------------------- */
const SUPABASE_URL = "";   // es. "https://abcdefgh.supabase.co"
const SUPABASE_KEY = "";   // chiave anon public (è pensata per stare nel front-end)
const BUCKET = "locandine";
const FEED_URL = "";       // alternativa senza Supabase: un events.json statico
const sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ZONES = {
  brescia:{lbl:"Piazzale Arnaldo",sub:"Brescia città"},
  franciacorta:{lbl:"Franciacorta",sub:"Capriolo · Corte Franca"},
  iseo:{lbl:"Lago d'Iseo",sub:"Iseo · Sarnico"},
  bassa:{lbl:"Bassa",sub:"Bagnolo · Ghedi"},
  garda:{lbl:"Lago di Garda",sub:"Desenzano · Lonato"},
};
const ROUTES = { iseo:["r-iseo","r-franciacorta"], franciacorta:["r-franciacorta"], brescia:[], bassa:["r-bassa"], garda:["r-garda"] };

const TYPES = [
  {id:"festa",lbl:"Feste",ico:"🎉"},{id:"club",lbl:"Club",ico:"🔊"},{id:"live",lbl:"Live",ico:"🎸"},
  {id:"aperitivo",lbl:"Aperitivo",ico:"🍹"},{id:"festival",lbl:"Festival & sagre",ico:"🎪"},
];

const VENUES = [
  {id:"arnaldo",name:"Piazzale Arnaldo",town:"Brescia",zone:"brescia",ig:"https://www.instagram.com/explore/tags/piazzalearnaldo/",maps:"https://maps.google.com/?q=Piazzale+Arnaldo+Brescia"},
  {id:"circus",name:"Circus Beat Club",town:"Brescia",zone:"brescia",ig:"https://www.instagram.com/circusbeatclub/",maps:"https://maps.google.com/?q=Circus+Beat+Club+Brescia"},
  {id:"molloy",name:"Latteria Molloy",town:"Brescia",zone:"brescia",ig:"https://www.instagram.com/latteriamolloy/",maps:"https://maps.google.com/?q=Latteria+Molloy+Brescia"},
  {id:"vinile",name:"Vinile 45",town:"Brescia",zone:"brescia",ig:"https://www.instagram.com/vinile45/",maps:"https://maps.google.com/?q=Vinile+45+Brescia"},
  {id:"fura",name:"Fura Look Club",town:"Capriolo",zone:"franciacorta",ig:"https://www.instagram.com/furalookclub/",maps:"https://maps.google.com/?q=Fura+Look+Club+Capriolo"},
  {id:"number1",name:"Number One",town:"Corte Franca",zone:"franciacorta",ig:"https://www.instagram.com/numberoneclub/",maps:"https://maps.google.com/?q=Number+One+Corte+Franca"},
  {id:"lidoiseo",name:"Lungolago di Iseo",town:"Iseo",zone:"iseo",ig:"https://www.instagram.com/explore/tags/iseo/",maps:"https://maps.google.com/?q=Lungolago+Iseo"},
  {id:"sarnico",name:"Sarnico Beach",town:"Sarnico",zone:"iseo",ig:"https://www.instagram.com/explore/tags/sarnico/",maps:"https://maps.google.com/?q=Sarnico+lungolago"},
  {id:"bagnolo",name:"Piazza di Bagnolo",town:"Bagnolo Mella",zone:"bassa",ig:"https://www.instagram.com/explore/tags/bagnolomella/",maps:"https://maps.google.com/?q=Bagnolo+Mella"},
  {id:"ghedi",name:"Area Feste Ghedi",town:"Ghedi",zone:"bassa",ig:"https://www.instagram.com/explore/tags/ghedi/",maps:"https://maps.google.com/?q=Ghedi"},
  {id:"coco",name:"Coco Beach",town:"Lonato del Garda",zone:"garda",ig:"https://www.instagram.com/cocobeachclub/",maps:"https://maps.google.com/?q=Coco+Beach+Lonato+del+Garda"},
  {id:"artclub",name:"Art Club",town:"Desenzano",zone:"garda",ig:"https://www.instagram.com/artclubdesenzano/",maps:"https://maps.google.com/?q=Art+Club+Desenzano"},
  {id:"sesto",name:"Sesto Senso",town:"Desenzano",zone:"garda",ig:"https://www.instagram.com/sestosensodesenzano/",maps:"https://maps.google.com/?q=Sesto+Senso+Desenzano"},
];

const today=new Date();today.setHours(0,0,0,0);
const d=o=>{const x=new Date(today);x.setDate(x.getDate()+o);return x.toISOString().slice(0,10)};
const toFri=(5-today.getDay()+7)%7;
const TODAY=d(0),TOMORROW=d(1),FRI=d(toFri),SAT=d(toFri+1),SUN=d(toFri+2);

let EVENTS=[
  {id:1,venue:"arnaldo",type:"aperitivo",date:TODAY,time:"18:30",title:"Aperitivo in piazzale",price:"Consumazione",desc:"Il classico. Spritz al tavolo, musica dai locali del piazzale, si tira tardi senza accorgersene.",poster:""},
  {id:2,venue:"molloy",type:"live",date:TODAY,time:"21:30",title:"Indie Night · band locali",price:"10 €",desc:"Tre band bresciane sul palco della Latteria. Porta i tappi.",poster:""},
  {id:3,venue:"vinile",type:"live",date:TOMORROW,time:"22:00",title:"Rock'n'roll Wednesday",price:"Ingresso libero",desc:"Vinili, birra e chitarre. Ogni mercoledì.",poster:""},
  {id:4,venue:"circus",type:"club",date:FRI,time:"23:30",title:"Friday · Reggaeton & Hip Hop",price:"15 € con drink",desc:"Due sale, due mood. Lista in prevendita sui social del club.",poster:""},
  {id:5,venue:"coco",type:"festa",date:FRI,time:"23:00",title:"Coco Friday · Summer Closing",price:"20 € + drink",desc:"Chiusura della stagione estiva sul lago: sala principale house, terrazza commerciale, ingresso dal molo.",poster:""},
  {id:6,venue:"fura",type:"club",date:SAT,time:"23:30",title:"Fura Saturday · Techno Room",price:"20 €",desc:"La domenica inizia quando finisce il sabato. Guest internazionale in console.",poster:""},
  {id:7,venue:"number1",type:"club",date:SAT,time:"23:00",title:"Number One · Big Room",price:"15 €",desc:"Il classico della Franciacorta. Tre sale, parcheggio enorme, navetta da Rovato.",poster:""},
  {id:8,venue:"lidoiseo",type:"aperitivo",date:SAT,time:"18:00",title:"Sunset on the lake · DJ set",price:"Ingresso libero",desc:"Aperitivo vista Montisola con dj set fino alle 22. Poi tutti in Franciacorta.",poster:""},
  {id:9,venue:"sarnico",type:"festival",date:SAT,time:"19:00",title:"Street Food Festival",price:"Ingresso libero",desc:"Trenta food truck sul lungolago, birra artigianale e musica dal vivo.",poster:""},
  {id:10,venue:"bagnolo",type:"festival",date:SAT,time:"20:00",title:"Sagra di fine estate",price:"Ingresso libero",desc:"Casoncelli, spiedo e balera. Domenica il gran finale.",poster:""},
  {id:11,venue:"artclub",type:"club",date:SAT,time:"23:30",title:"Art Club · Saturday Night",price:"20 € + drink",desc:"Il sabato del Garda. Ospiti a rotazione, prevendite su Instagram.",poster:""},
  {id:12,venue:"sesto",type:"club",date:SAT,time:"23:00",title:"Sesto Senso · House Session",price:"15 €",desc:"House e tech-house sulla terrazza vista lago.",poster:""},
  {id:13,venue:"coco",type:"festa",date:SUN,time:"16:00",title:"Sunday Pool Party",price:"15 €",desc:"Piscina, dj set dal pomeriggio, cena al tramonto. Ultima domenica della stagione.",poster:""},
  {id:14,venue:"ghedi",type:"festival",date:SUN,time:"18:00",title:"Festa della birra",price:"Ingresso libero",desc:"Birre alla spina, tribute band e giochi.",poster:""},
  {id:15,venue:"arnaldo",type:"aperitivo",date:SUN,time:"18:00",title:"Domenica in piazzale",price:"Consumazione",desc:"Chiudi il weekend con calma.",poster:""},
];

/* ============ STATO ============ */
const state={day:"oggi",zone:"all",type:"all",q:"",saved:new Set()};
const DAYS=[
  {id:"oggi",lbl:"Stasera",test:e=>e.date===TODAY,claim:"Cosa fai <em>stasera</em>?"},
  {id:"domani",lbl:"Domani",test:e=>e.date===TOMORROW,claim:"Cosa fai <em>domani</em>?"},
  {id:"ven",lbl:"Venerdì",test:e=>e.date===FRI,claim:"Cosa fai <em>venerdì</em>?"},
  {id:"sab",lbl:"Sabato",test:e=>e.date===SAT,claim:"Cosa fai <em>sabato</em>?"},
  {id:"dom",lbl:"Domenica",test:e=>e.date===SUN,claim:"Cosa fai <em>domenica</em>?"},
  {id:"tutti",lbl:"Tutta la settimana",test:()=>true,claim:"Cosa fai <em>sta settimana</em>?"},
];
const $=s=>document.querySelector(s);
const venueOf=id=>VENUES.find(v=>v.id===id);
const typeOf=id=>TYPES.find(t=>t.id===id);
const fmtDate=iso=>new Date(iso+"T12:00:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function filtered(opt={}){
  const day=DAYS.find(x=>x.id===state.day), q=state.q.trim().toLowerCase();
  return EVENTS.filter(e=>{
    const v=venueOf(e.venue);
    if(!day.test(e))return false;
    if(!opt.ignoreZone&&state.zone!=="all"&&v.zone!==state.zone)return false;
    if(state.type!=="all"&&e.type!==state.type)return false;
    if(q&&!(e.title+" "+v.name+" "+v.town+" "+e.desc).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function poster(e,extra=""){
  const v=venueOf(e.venue);
  if(e.poster)return `<div class="pst ${extra}"><img src="${esc(e.poster)}" alt="Locandina ${esc(e.title)}" loading="lazy"></div>`;
  return `<div class="pst gen s${e.id%3} ${extra}"><div class="big">${esc(e.title)}</div></div>`;
}

/* ============ RENDER ============ */
function renderDays(){
  $("#days").innerHTML=DAYS.map(x=>`<button class="day" data-day="${x.id}" aria-pressed="${state.day===x.id}">${x.lbl}</button>`).join("");
  $("#claim").innerHTML=DAYS.find(x=>x.id===state.day).claim;
}
function renderTicker(){
  const list=filtered({ignoreZone:true}).slice(0,8);
  const items=(list.length?list:EVENTS.slice(0,8)).map(e=>`<span>${esc(e.title)} — ${esc(venueOf(e.venue).name)}</span>`).join("");
  $("#ticker").innerHTML=items+items;
}
function renderHero(){
  const list=filtered();
  if(!list.length){$("#heroWrap").innerHTML="";return}
  const e=list.find(x=>x.type==="festa"||x.type==="club")||list[0], v=venueOf(e.venue), t=typeOf(e.type);
  $("#heroWrap").innerHTML=`<button class="hero" data-open="${e.id}">
    ${poster(e)}<div class="shade"></div>
    <div class="tag"><span class="chip blue">In evidenza</span><span class="chip">${t.lbl}</span></div>
    <div class="txt"><div class="when">${fmtDate(e.date)} · ${e.time}</div><h2>${esc(e.title)}</h2><p><b>${esc(v.name)}</b> · ${esc(v.town)} · ${esc(e.price)}</p></div>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
  </button>`;
}
function renderMap(){
  const counts={};filtered({ignoreZone:true}).forEach(e=>{const z=venueOf(e.venue).zone;counts[z]=(counts[z]||0)+1});
  document.querySelectorAll("#map .node").forEach(n=>{
    const z=n.dataset.zone, on=state.zone===z;
    n.classList.toggle("on",on);n.classList.toggle("dim",state.zone!=="all"&&!on);
    n.querySelectorAll(".badge,.k").forEach(x=>x.remove());
    if(counts[z]){n.insertAdjacentHTML("beforeend",`<circle class="badge" cx="11" cy="-10" r="7"/><text class="k" x="11" y="-10">${counts[z]}</text>`)}
  });
  document.querySelectorAll("#map .lake").forEach(l=>l.classList.toggle("on",state.zone===l.dataset.zone));
  document.querySelectorAll("#map .route").forEach(r=>r.classList.remove("on"));
  (ROUTES[state.zone]||[]).forEach(id=>document.getElementById(id).classList.add("on"));
  $("#mapHint").textContent=state.zone==="all"?"Tocca una zona":"Tocca di nuovo per tutta la provincia";
}
function renderTipi(){
  $("#tipi").innerHTML=[{id:"all",lbl:"Tutto",ico:"✦"},...TYPES].map(t=>`<button class="tipo" data-type="${t.id}" aria-pressed="${state.type===t.id}"><span>${t.ico}</span>${t.lbl}</button>`).join("");
}
function renderGrid(){
  const list=filtered();
  $("#secTitle").textContent=state.zone==="all"?"In tutta la provincia":ZONES[state.zone].lbl;
  $("#secCount").textContent=list.length?`${list.length} event${list.length===1?"o":"i"}`:"";
  if(!list.length){$("#grid").innerHTML=`<div class="empty"><strong>Niente qui, per ora</strong>Prova un'altra zona o un altro giorno.<br>Gestisci un locale? Pubblica tu il primo evento.</div>`;return}
  $("#grid").innerHTML=list.map((e,i)=>{const v=venueOf(e.venue),t=typeOf(e.type);return `<article class="card" style="animation-delay:${i*35}ms">
    <div data-open="${e.id}" role="button" tabindex="0" style="position:absolute;inset:0">${poster(e)}<div class="shade"></div></div>
    <div class="top"><span class="chip">${t.lbl}</span><button class="heart ${state.saved.has(e.id)?'on':''}" data-save="${e.id}" aria-label="Salva"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/></svg></button></div>
    <div class="txt" data-open="${e.id}"><div class="when">${fmtDate(e.date)} · ${e.time}</div><h4>${esc(e.title)}</h4><div class="where"><b>${esc(v.name)}</b> · ${esc(v.town)}</div></div>
  </article>`}).join("");
}
function renderVenues(){
  const vs=state.zone==="all"?VENUES:VENUES.filter(v=>v.zone===state.zone);
  $("#venueCount").textContent=`${vs.length} locali`;
  $("#venueList").innerHTML=vs.map(v=>`<button class="venue" data-venue="${v.id}"><span class="av">${v.name.slice(0,2).toUpperCase()}</span><span>${esc(v.name)}<small>${esc(v.town)} · ${EVENTS.filter(e=>e.venue===v.id).length} eventi</small></span></button>`).join("");
}
function renderAll(){renderDays();renderTicker();renderHero();renderMap();renderTipi();renderGrid();renderVenues()}

/* ============ SHEET ============ */
const igI=`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8"/></svg>`;
const pinI=`<svg viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.5"/></svg>`;
function openSheet(h){$("#sheet").innerHTML=`<div class="grab"></div>`+h;$("#sheet").classList.add("open");$("#overlay").classList.add("open");document.body.style.overflow="hidden";$("#sheet").scrollTop=0}
function closeSheet(){$("#sheet").classList.remove("open");$("#overlay").classList.remove("open");document.body.style.overflow=""}
function openEvent(id){
  const e=EVENTS.find(x=>x.id==id),v=venueOf(e.venue),t=typeOf(e.type),z=ZONES[v.zone];
  openSheet(`${poster(e,"sp")}<div class="sb">
    <div class="eyebrow">${t.lbl} · ${z.lbl}</div><h2>${esc(e.title)}</h2>
    <div class="meta"><div><small>Quando</small><b>${fmtDate(e.date)} · ${e.time}</b></div><div><small>Ingresso</small><b>${esc(e.price)}</b></div><div style="grid-column:1/-1"><small>Dove</small><b>${esc(v.name)}, ${esc(v.town)}</b></div></div>
    <p class="desc">${esc(e.desc)}</p>
    <div class="actions"><a class="btn primary" href="${v.ig}" target="_blank" rel="noopener">${igI} Evento su Instagram</a><a class="btn ghost" href="${v.maps}" target="_blank" rel="noopener">${pinI} Come arrivo</a><button class="btn ghost" data-share="${e.id}">Condividi</button></div>
    <p class="note">Locandina e dettagli sono pubblicati da ${esc(v.name)}. Per liste e prevendite fa fede il profilo del locale.</p></div>`);
}
function openVenue(id){
  const v=venueOf(id),z=ZONES[v.zone],evs=EVENTS.filter(e=>e.venue===id).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  openSheet(`<div class="sb"><div class="eyebrow">${z.lbl} · ${esc(v.town)}</div><h2>${esc(v.name)}</h2>
    <div class="actions" style="margin-top:4px"><a class="btn primary" href="${v.ig}" target="_blank" rel="noopener">${igI} Profilo</a><a class="btn ghost" href="${v.maps}" target="_blank" rel="noopener">${pinI} Mappa</a></div>
    <div class="sech" style="margin-top:22px"><h3 style="color:var(--el)">Prossimi eventi</h3><span style="color:#6B7394">${evs.length}</span></div>
    <div class="grid">${evs.map(e=>`<article class="card"><div data-open="${e.id}" role="button" tabindex="0" style="position:absolute;inset:0">${poster(e)}<div class="shade"></div></div><div class="txt" data-open="${e.id}"><div class="when">${fmtDate(e.date)} · ${e.time}</div><h4>${esc(e.title)}</h4></div></article>`).join("")||`<div class="empty" style="color:#6B7394">Nessun evento pubblicato.</div>`}</div></div>`);
}
function openPublish(){
  openSheet(`<div class="sb"><div class="eyebrow">Per i locali</div><h2>Pubblica la tua locandina</h2>
    <p class="desc" style="margin-bottom:16px">Carica l'immagine e compila i dati: l'evento entra subito in mappa. Gratis.</p>
    <div class="field"><label>Locale</label><select id="pVenue">${VENUES.map(v=>`<option value="${v.id}">${esc(v.name)} — ${esc(v.town)}</option>`).join("")}<option value="__new">➕ Il mio locale non c'è</option></select></div>
    <div id="newVenue" style="display:none">
      <div class="row2"><div class="field"><label>Nome locale</label><input id="nvName" placeholder="es. Coco Beach"></div><div class="field"><label>Paese</label><input id="nvTown" placeholder="es. Lonato del Garda"></div></div>
      <div class="row2"><div class="field"><label>Zona</label><select id="nvZone">${Object.entries(ZONES).map(([k,z])=>`<option value="${k}">${z.lbl}</option>`).join("")}</select></div><div class="field"><label>Instagram (link)</label><input id="nvIg" placeholder="https://instagram.com/…"></div></div>
    </div>
    <div class="field"><label>Titolo evento</label><input id="pTitle" placeholder="es. Saturday Night · Guest DJ"></div>
    <div class="row2"><div class="field"><label>Data</label><input id="pDate" type="date" value="${SAT}"></div><div class="field"><label>Ora</label><input id="pTime" type="time" value="23:00"></div></div>
    <div class="row2"><div class="field"><label>Tipo</label><select id="pType">${TYPES.map(t=>`<option value="${t.id}">${t.lbl}</option>`).join("")}</select></div><div class="field"><label>Ingresso</label><input id="pPrice" placeholder="es. 15 € con drink"></div></div>
    <div class="field"><label>Descrizione</label><textarea id="pDesc" placeholder="Line-up, sale, prevendite…"></textarea></div>
    <div class="field"><label>Locandina</label><div class="drop">Tocca per caricare la locandina (jpg/png)<input type="file" id="pFile" accept="image/*"><div id="prev"></div></div></div>
    <div class="actions"><button class="btn primary" id="pSend">Pubblica evento</button></div>
    <p class="note">${sb?"L'evento viene pubblicato su BRIXOUT e lo vedono tutti. Locandina max 5 MB.":"Demo: l'evento resta su questo dispositivo. Collega Supabase per renderlo visibile a tutti."}</p></div>`);
  let posterData="", posterFile=null;
  $("#pVenue").addEventListener("change",ev=>{$("#newVenue").style.display=ev.target.value==="__new"?"block":"none"});
  $("#pFile").addEventListener("change",ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>5*1024*1024){toast("Locandina troppo pesante (max 5 MB)");return}posterFile=f;const r=new FileReader();r.onload=()=>{posterData=r.result;$("#prev").innerHTML=`<img src="${posterData}" alt="">`};r.readAsDataURL(f)});
  $("#pSend").addEventListener("click",async()=>{
    const btn=$("#pSend"), title=$("#pTitle").value.trim();
    if(!title){toast("Manca il titolo dell'evento");$("#pTitle").focus();return}
    let venueId=$("#pVenue").value, newVenue=null;
    if(venueId==="__new"){
      const name=$("#nvName").value.trim(), town=$("#nvTown").value.trim();
      if(!name||!town){toast("Nome e paese del locale");$("#nvName").focus();return}
      venueId=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);
      const ig=$("#nvIg").value.trim();
      newVenue={id:venueId,name,town,zone:$("#nvZone").value,ig:ig||`https://www.instagram.com/explore/search/keyword/?q=${encodeURIComponent(name)}`,maps:`https://maps.google.com/?q=${encodeURIComponent(name+" "+town)}`};
    }
    const ev={venue:venueId,type:$("#pType").value,date:$("#pDate").value,time:$("#pTime").value,title,price:$("#pPrice").value||"Info al locale",desc:$("#pDesc").value,poster:posterData};
    btn.disabled=true; btn.textContent="Pubblico…";
    try{
      if(sb){
        if(newVenue){const {error}=await sb.from("venues").insert(newVenue);if(error)throw error}
        if(posterFile){
          const ext=(posterFile.name.split(".").pop()||"jpg").toLowerCase(), path=`${venueId}/${Date.now()}.${ext}`;
          const {error}=await sb.storage.from(BUCKET).upload(path,posterFile,{contentType:posterFile.type,upsert:false});
          if(error)throw error;
          ev.poster=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
        }
        const {data,error}=await sb.from("events").insert(ev).select().single();
        if(error)throw error;
        if(newVenue)VENUES.push(newVenue);
        EVENTS.push({...data,poster:data.poster||""});
      }else{
        if(newVenue)VENUES.push(newVenue);
        EVENTS.push({...ev,id:Date.now()});
      }
      closeSheet();state.day="tutti";state.zone="all";state.type="all";renderAll();toast("Pubblicato ✓");
    }catch(err){
      console.error(err); btn.disabled=false; btn.textContent="Pubblica evento";
      toast("Non sono riuscito a pubblicare: "+(err.message||"riprova"));
    }
  });
}

/* ============ EVENTI UI ============ */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
document.addEventListener("click",ev=>{
  if(ev.target.closest("#overlay")){closeSheet();return}
  const b=ev.target.closest("[data-day],[data-type],[data-zone],[data-open],[data-save],[data-venue],[data-share]");if(!b)return;
  if(b.dataset.save){ev.stopPropagation();const id=+b.dataset.save;state.saved.has(id)?state.saved.delete(id):state.saved.add(id);b.classList.toggle("on");toast(state.saved.has(id)?"Salvato ♥":"Rimosso");return}
  if(b.dataset.share){const e=EVENTS.find(x=>x.id==b.dataset.share),v=venueOf(e.venue),text=`${e.title} · ${v.name}, ${v.town} · ${fmtDate(e.date)} ${e.time}`;if(navigator.share)navigator.share({title:e.title,text,url:v.ig}).catch(()=>{});else{navigator.clipboard?.writeText(text+" "+v.ig);toast("Copiato negli appunti")}return}
  if(b.dataset.open){openEvent(b.dataset.open);return}
  if(b.dataset.venue){openVenue(b.dataset.venue);return}
  if(b.dataset.day){state.day=b.dataset.day;renderAll();return}
  if(b.dataset.zone){state.zone=state.zone===b.dataset.zone?"all":b.dataset.zone;renderHero();renderMap();renderGrid();renderVenues();return}
  if(b.dataset.type){state.type=b.dataset.type;renderTipi();renderHero();renderMap();renderGrid();return}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeSheet();if((ev.key==="Enter"||ev.key===" ")&&ev.target.dataset?.open){ev.preventDefault();openEvent(ev.target.dataset.open)}});
$("#btnSearch").addEventListener("click",()=>{const s=$("#search");s.classList.toggle("open");if(s.classList.contains("open"))$("#q").focus();else{state.q="";$("#q").value="";renderGrid();renderMap();renderHero()}});
$("#q").addEventListener("input",ev=>{state.q=ev.target.value;renderGrid();renderMap();renderHero()});
$("#btnPub").addEventListener("click",openPublish);

async function loadFeed(){
  if(sb){
    try{
      const [{data:vs,error:e1},{data:evs,error:e2}] = await Promise.all([
        sb.from("venues").select("*").order("name"),
        sb.from("events").select("*").eq("approved",true).gte("date",TODAY).order("date").order("time")
      ]);
      if(e1||e2) throw (e1||e2);
      VENUES.length=0; vs.forEach(v=>VENUES.push(v));
      EVENTS = evs.map(e=>({...e, poster:e.poster||""}));
      renderAll();
    }catch(err){ console.warn("Supabase:",err); toast("Database non raggiungibile, mostro la demo"); }
    return;
  }
  if(!FEED_URL)return;
  try{const r=await fetch(FEED_URL,{cache:"no-store"});const data=await r.json();
    if(Array.isArray(data.venues))data.venues.forEach(v=>{if(!venueOf(v.id))VENUES.push(v)});
    if(Array.isArray(data.events))EVENTS=EVENTS.concat(data.events);renderAll()}
  catch(err){console.warn("Feed non raggiungibile:",err)}
}
renderAll();loadFeed();

/* ============ PWA ============ */
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW:",e)))}
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(!standalone)$("#install").classList.add("show")});
if(isIOS && !standalone){$("#installHint").textContent="Tocca Condividi ⬆ e poi \"Aggiungi alla schermata Home\".";$("#installBtn").style.display="none";$("#install").classList.add("show")}
$("#installBtn").addEventListener("click",async()=>{if(!installEvt)return;installEvt.prompt();const {outcome}=await installEvt.userChoice;if(outcome==="accepted")$("#install").classList.remove("show");installEvt=null});
$("#installClose").addEventListener("click",()=>$("#install").classList.remove("show"));
window.addEventListener("appinstalled",()=>{$("#install").classList.remove("show");toast("BRIXOUT installata ✓")});
</script>
